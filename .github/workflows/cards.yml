name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: streak
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate stats card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide=stars&prs_merged&include_all_commits=true&rank_icon=github&ring_color=FFD700&title_color=FFD700&text_color=FFD700&icon_color=FFD700&border_color=FFD700&bg_color=002137
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add profile/*.svg
          git commit -m "Update README cards" || echo "No changes to commit"
          git push origin HEAD