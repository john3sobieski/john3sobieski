name: Update Discord status badge

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Discord presence from Lanyard
        env:
          DISCORD_USER_ID: "661912805313871891"
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const states = {
            online: { color: "brightgreen" },
            idle: { color: "yellow" },
            dnd: { color: "red" },
            offline: { color: "lightgrey" },
          };

          async function main() {
            let status = "unknown";

            try {
              const response = await fetch(
                `https://api.lanyard.rest/v1/users/${process.env.DISCORD_USER_ID}`,
              );
              const payload = await response.json();
              if (response.ok && payload.success && states[payload.data?.discord_status]) {
                status = payload.data.discord_status;
              } else {
                console.error("Lanyard did not return a Discord status.");
              }
            } catch (error) {
              console.error("Could not fetch Lanyard status:", error);
            }

            const badge = {
              schemaVersion: 1,
              label: "currently",
              message: status,
              color: states[status]?.color ?? "lightgrey",
            };

            fs.writeFileSync(
              "profile/discord-status.json",
              `${JSON.stringify(badge, null, 2)}\n`,
            );
          }

          main();
          NODE

      - name: Commit changed status
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/discord-status.json
          git commit -m "chore: update Discord status badge"
          git push
